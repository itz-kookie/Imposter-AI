name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Select AI provider
        id: ai
        # AI_PROVIDER is a GitHub repository variable (Settings -> Secrets and variables -> Actions -> Variables).
        # Only the secret for the selected provider is uploaded, because wrangler-action fails on an empty secret.
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
        run: |
          case "$AI_PROVIDER" in
            gemini)  echo "secret=GEMINI_API_KEY"  >> "$GITHUB_OUTPUT"; echo "vars=AI_PROVIDER" >> "$GITHUB_OUTPUT" ;;
            mistral) echo "secret=MISTRAL_API_KEY" >> "$GITHUB_OUTPUT"; echo "vars=AI_PROVIDER" >> "$GITHUB_OUTPUT" ;;
            openai)  echo "secret=OPENAI_API_KEY"  >> "$GITHUB_OUTPUT"; printf 'vars<<EOF\nAI_PROVIDER\nOPENAI_BASE_URL\nOPENAI_MODEL\nEOF\n' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown AI_PROVIDER '$AI_PROVIDER' (expected gemini, mistral or openai)" >&2; exit 1 ;;
          esac
      - name: Deploy Worker with static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          vars: ${{ steps.ai.outputs.vars }}
          secrets: ${{ steps.ai.outputs.secret }}
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
